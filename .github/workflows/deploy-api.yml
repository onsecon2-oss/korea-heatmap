name: Deploy API to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - 'workers/**'
  workflow_dispatch:

concurrency:
  group: cf-deploy-api
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy workers/ (kospi-bets-api) to Cloudflare Workers
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Sync GH_DISPATCH_TOKEN secret to Worker
        run: |
          if [ -z "$GH_DISPATCH_TOKEN" ]; then
            echo "GH_DISPATCH_TOKEN repo secret not set -- skipping"
            exit 0
          fi
          echo "$GH_DISPATCH_TOKEN" | npx wrangler secret put GH_DISPATCH_TOKEN --env production
        env:
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
