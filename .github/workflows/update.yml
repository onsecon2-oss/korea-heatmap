name: Update KOSPI 200

# 일 3회 고정 갱신 (월~금)
#   09:30 KST = 00:30 UTC  (시초가 안정화)
#   13:00 KST = 04:00 UTC  (점심 시간)
#   16:00 KST = 07:00 UTC  (정규장 마감 + 종가 동시호가 반영)
#
# GitHub Actions schedule 은 ±10분 지연·드물게 스킵 가능 (공식 문서 명시).
# 정밀 운영이 필요해지면 Cloudflare Workers Cron 또는 Fly.io machines 로 마이그레이션.

on:
  schedule:
    # 매 15분 갱신 (월~금, 한국 장중)
    # GHA cron 스킵 빈번 → 빈도 2배 늘려 안정성 확보
    # 비혼잡 분단위 (:05, :20, :35, :50)
    - cron: '5,20,35,50 0-7 * * 1-5'
  workflow_dispatch:

concurrency:
  group: kospi-update
  cancel-in-progress: false

jobs:
  test:
    name: Run pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests (mock-only)
        run: pytest tests/ --ignore=tests/test_output_schema.py -v

  update:
    name: Fetch + validate + commit
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Fetch KOSPI 200 (with retry, KST timezone)
        env:
          # KRX 차단 회피용 User-Agent (브라우저 위장)
          PYTHONUNBUFFERED: "1"
        run: |
          cd ingest
          python run.py
        # 휴장일이면 종료코드 0 으로 SKIP, treemap.json 미변경
        # KRX 호출 실패 시 로컬 영업일 fallback 으로 진행

      # F2: fetch 직후 validate + schema 테스트 (실패 시 commit 안 됨)
      - name: Validate output (CI gate)
        run: python tests/validate_output.py web/data/treemap.json

      - name: Schema test against new data
        run: pytest tests/test_output_schema.py -v

      - name: Commit if changed (amend last data commit to avoid history bloat)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/treemap.json web/data/treemap.pretty.json web/data/_meta.json || true
          if git diff --cached --quiet; then
            echo "변경사항 없음 — commit 생략"
            exit 0
          fi
          # 마지막 commit이 cron의 data commit이면 amend (history 누적 방지)
          # 사용자 push와의 충돌 최소화 — cron commit이 1개로 압축됨
          LAST_MSG=$(git log -1 --pretty=%s)
          LAST_AUTHOR=$(git log -1 --pretty=%ae)
          NEW_MSG="data: KOSPI 200 snapshot $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
          if echo "$LAST_MSG" | grep -q "^data: KOSPI 200 snapshot" && [ "$LAST_AUTHOR" = "41898282+github-actions[bot]@users.noreply.github.com" ]; then
            echo "이전 cron commit을 amend (history 압축)"
            git commit --amend -m "$NEW_MSG"
            git push --force-with-lease
          else
            echo "사용자 commit 위에 새 cron commit 추가"
            git commit -m "$NEW_MSG"
            git push
          fi

  notify-failure:
    name: Open issue on failure
    needs: [test, update]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create / update tracking issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'KOSPI 갱신 실패 — 자동 알림';
            const body = [
              '## 자동 알림: KOSPI 200 갱신 실패',
              '',
              '- 실행 시각(UTC): ' + new Date().toISOString(),
              '- Run URL: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
              '',
              '### 영향',
              '- 서비스는 마지막 정상 커밋된 treemap.json 으로 계속 운영됩니다.',
              '- 사용자에게 보이는 데이터는 stale 상태가 됩니다.',
              '',
              '### 운영자 액션',
              '- [ ] Actions 로그 확인',
              '- [ ] yfinance 응답 형식 변경 의심 시 라이브러리 버전 점검',
              '- [ ] Yahoo Finance API 차단 의심 시 KIS API 백업 라인 활성화',
              '- [ ] 연속 3회 실패 시 수동 트리거(workflow_dispatch)로 재시도',
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'auto-alert',
            });
            const existing = issues.find(i => i.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number,
                body: '재발생: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['auto-alert', 'bug'],
              });
            }
